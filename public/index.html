<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contratos e RT</title>
  <!-- favicon nas cores da marca: "e" laranja sobre quadrado indigo -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2340316a'/><text x='32' y='45' font-size='42' font-weight='700' font-family='system-ui,sans-serif' fill='%23e5762d' text-anchor='middle'>e</text></svg>" />
  <meta name="theme-color" content="#40316a" />
  <link rel="preload" href="/fontes/InterVariable.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="app">
    <aside class="lateral">
      <div class="marca">
        <picture class="marca-logo">
          <source srcset="/imagens/marca-ecoart-escuro.svg" media="(prefers-color-scheme: dark)" />
          <img src="/imagens/marca-ecoart.svg" alt="ECOART Soluções" width="372" height="109" />
        </picture>
        <div class="marca-sistema">
          <strong>Contratos e RT</strong>
          <small id="marca-empresa">Configure a empresa</small>
        </div>
      </div>

      <nav class="menu">
        <a href="#/painel" data-nav="painel"><span>Painel</span><b id="badge-alertas" class="badge"></b></a>
        <a href="#/contratos" data-nav="contratos"><span>Contratos</span></a>
        <a href="#/configuracoes" data-nav="configuracoes"><span>Configurações</span></a>
      </nav>

      <button class="botao primario largo" id="btn-novo-contrato">+ Novo contrato</button>

      <div class="lateral-rodape">
        <p>A CAT é expedida pelo CREA. O sistema gera o <strong>atestado</strong> para o contratante assinar e o <strong>requerimento</strong> para protocolar.</p>
        <a class="lateral-sair" href="/sair">Sair</a>
      </div>
    </aside>

    <main class="conteudo" id="conteudo">
      <div class="carregando">Carregando…</div>
    </main>
  </div>

  <div class="modal-fundo" id="modal-fundo" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>

  <div class="avisos" id="avisos"></div>

  <script type="module" src="/js/app.js"></script>
  <!-- movimento de entrada das telas; se instala sozinho e nao altera o app.js -->
  <script type="module" src="/js/animacoes.js"></script>
</body>
</html>
