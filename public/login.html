<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Entrar · Contratos e RT</title>
<meta name="theme-color" content="#2d1a68" />
<link rel="preload" href="/fontes/InterVariable.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="/css/app.css" />
<link rel="stylesheet" href="/css/login.css" />
</head>
<body class="tela-entrada">

  <div class="palco" aria-hidden="true"><div class="palco-arte"></div></div>

  <main class="entrada">
    <img class="entrada-marca" src="/imagens/marca-ecoart.svg"
         alt="ECOART Soluções" width="372" height="109" />

    <div class="entrada-cartao">
      <div class="entrada-titulo">
        <h1>Contratos e RT</h1>
        <p>Gestão de contratos e responsabilidades técnicas</p>
      </div>

      <p class="entrada-erro" id="entrada-erro" role="alert" hidden>
        Senha incorreta. Confira e tente de novo.
      </p>

      <form class="entrada-form" method="post" action="/entrar">
        <div class="campo">
          <label for="usuario">Usuário</label>
          <input id="usuario" name="usuario" type="text" autocomplete="username"
                 autocapitalize="none" spellcheck="false" required />
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <input id="senha" name="senha" type="password" autocomplete="current-password"
                 autofocus required />
        </div>
        <button class="botao primario largo" type="submit">Entrar</button>
      </form>

      <p class="entrada-rodape">
        <strong>Acesso restrito · ECOART Soluções Ltda</strong>
        Os contratos guardados aqui pertencem a terceiros. Não compartilhe seu acesso.
      </p>
    </div>
  </main>

  <script>
    // A pagina e estatica: o servidor nao tem como escrever o erro dentro
    // dela, entao avisa pela propria URL e quem revela e este pedaco.
    if (new URLSearchParams(location.search).has('erro')) {
      document.getElementById('entrada-erro').hidden = false;
      document.getElementById('senha').focus();
    }
  </script>

</body>
</html>
